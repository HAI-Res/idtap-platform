# IDTAP reverse proxy — CSAIL box (idtap.csail.mit.edu / swara.studio)
# Adapted from the DigitalOcean production config (captured 2026-07-13).
# Install: copy to /etc/nginx/sites-available/idtap, symlink into sites-enabled/,
#          remove the default site, `nginx -t && systemctl reload nginx`.
#
# nginx terminates TLS and proxies everything to the Node app on 127.0.0.1:3000.
# The Node app serves BOTH the built frontend (dist/) and the API, so nginx is a
# thin proxy. Nothing here is reachable until the CSAIL border firewall opens
# public inbound to 80/443 (pending TIG).
#
# NOTE vs the old DO config: DO had a port-80 `default_server` that proxied ALL
# traffic (incl. raw-IP) straight to the app — that's what let the unauthed API be
# hit by raw IP (see review-2026 finding). Here, port 80 only serves the ACME
# challenge and redirects to HTTPS; only the named vhosts are proxied. Defense in
# depth until A5 adds route auth.

# ---- Port 80: ACME (Let's Encrypt HTTP-01) + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name idtap.csail.mit.edu swara.studio www.swara.studio;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;              # certbot --webroot -w /var/www/certbot
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Port 443: TLS termination + proxy to the Node app ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Pre-cutover, serve on the CSAIL name; add swara.studio once DNS is moved.
    server_name idtap.csail.mit.edu swara.studio www.swara.studio;

    client_max_body_size 2000M;             # large audio uploads (matches DO)

    # --- TLS (certbot fills/maintains these; see README) ---
    ssl_certificate     /etc/letsencrypt/live/idtap.csail.mit.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idtap.csail.mit.edu/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Long-running analysis requests — 90 min, matches DO.
        proxy_connect_timeout 600s;
        proxy_read_timeout    5400s;
        proxy_send_timeout    5400s;

        # WebSocket upgrade (the app uses ws).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;
        proxy_cache_bypass          $http_upgrade;
    }
}

# Optional hardening: reject raw-IP / unknown-host HTTPS with a closed default
# server so only the named vhosts are reachable. Uncomment once a cert exists.
